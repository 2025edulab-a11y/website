<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 — Aurora</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="auth.css" />
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html" aria-label="Aurora 홈">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2c2.2 2.4 3.3 5 3.3 7.6 0 4-2.6 7.4-3.3 8.4-.7-1-3.3-4.4-3.3-8.4C8.7 7 9.8 4.4 12 2zm0 20c1.4-1 2.4-2.4 3-4-1 .5-2 .8-3 .8s-2-.3-3-.8c.6 1.6 1.6 3 3 4z"/></svg>
    </a>
    <nav class="nav-links" aria-label="주요">
      <a href="index.html">홈</a>
      <a href="mypage.html">마이페이지</a>
    </nav>
    <div class="nav-actions"><span class="nav-auth" id="nav-auth"></span></div>
  </div>
</header>

<main class="page">
  <div class="card card--wide" id="card">
    <h1>관리자 페이지</h1>
    <p class="sub">회원 목록 및 권한 관리</p>
    <div class="msg err" id="err"></div>
    <div class="msg ok" id="ok"></div>
    <div id="content"></div>
  </div>
</main>

<script type="module">
  import { supabase, requireAdmin, renderNavAuth, escapeHtml } from "./app.js";

  renderNavAuth();

  const content = document.getElementById("content");
  const err = document.getElementById("err");
  const ok = document.getElementById("ok");

  const gate = await requireAdmin();
  if (gate === null) {
    // requireAuth 가 이미 login 으로 보냄
  } else if (!gate.ok) {
    content.innerHTML =
      '<p style="padding:30px 0;text-align:center;color:var(--grey-text)">이 페이지에 접근할 권한이 없습니다.<br /><a href="index.html" style="color:var(--blue)">홈으로</a></p>';
  } else {
    await loadUsers(gate.user.id);
  }

  async function loadUsers(myId) {
    const { data, error } = await supabase
      .from("profiles")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      err.textContent = "목록을 불러오지 못했습니다: " + error.message;
      err.classList.add("show");
      return;
    }

    const admins = data.filter((u) => u.role === "admin").length;
    const rows = data
      .map((u) => {
        const self = u.id === myId ? ' <span class="badge">나</span>' : "";
        return `<tr data-id="${u.id}">
          <td>${escapeHtml(u.full_name || "—")}${self}</td>
          <td>${escapeHtml(u.email || "—")}</td>
          <td>
            <select data-id="${u.id}" ${u.id === myId ? "disabled title='본인 권한은 변경할 수 없습니다'" : ""}>
              <option value="user" ${u.role === "user" ? "selected" : ""}>user</option>
              <option value="admin" ${u.role === "admin" ? "selected" : ""}>admin</option>
            </select>
          </td>
          <td>${new Date(u.created_at).toLocaleDateString("ko-KR")}</td>
        </tr>`;
      })
      .join("");

    content.innerHTML = `
      <p class="stat-line">전체 ${data.length}명 · 관리자 ${admins}명</p>
      <div class="table-wrap">
        <table class="users">
          <thead><tr><th>이름</th><th>이메일</th><th>권한</th><th>가입일</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;

    content.querySelectorAll("select[data-id]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const id = sel.dataset.id;
        const role = sel.value;
        const prev = sel.dataset.prev || (role === "user" ? "admin" : "user");
        sel.disabled = true;
        const { error } = await supabase
          .from("profiles")
          .update({ role })
          .eq("id", id);
        sel.disabled = false;
        if (error) {
          err.textContent = "변경 실패: " + error.message;
          err.classList.add("show");
          sel.value = prev;
        } else {
          ok.textContent = `권한을 '${role}' 로 변경했습니다.`;
          ok.classList.add("show");
          sel.dataset.prev = role;
          setTimeout(() => ok.classList.remove("show"), 2500);
        }
      });
    });
  }
</script>
</body>
</html>
