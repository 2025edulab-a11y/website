<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마이페이지 — Aurora</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="auth.css" />
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html" aria-label="Aurora 홈">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2c2.2 2.4 3.3 5 3.3 7.6 0 4-2.6 7.4-3.3 8.4-.7-1-3.3-4.4-3.3-8.4C8.7 7 9.8 4.4 12 2zm0 20c1.4-1 2.4-2.4 3-4-1 .5-2 .8-3 .8s-2-.3-3-.8c.6 1.6 1.6 3 3 4z"/></svg>
    </a>
    <nav class="nav-links" aria-label="주요">
      <a href="index.html#phone">Aurora Phone</a>
      <a href="index.html#book">Aurora Book</a>
      <a href="index.html#watch">Aurora Watch</a>
      <a href="index.html#tab">Aurora Tab</a>
    </nav>
    <div class="nav-actions"><span class="nav-auth" id="nav-auth"></span></div>
  </div>
</header>

<main class="page">
  <div class="card" id="card" style="visibility:hidden">
    <h1>마이페이지</h1>
    <p class="sub">계정 정보를 확인하고 수정합니다</p>

    <div class="msg ok" id="ok"></div>
    <div class="msg err" id="err"></div>

    <div class="profile-head">
      <div class="avatar" id="avatar">A</div>
      <div>
        <div class="who"><span id="who"></span><span class="badge" id="role-badge">USER</span></div>
        <div class="mail" id="mail"></div>
      </div>
    </div>

    <form id="form">
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" autocomplete="name" />
      </div>
      <button type="submit" class="btn-block" id="save">저장</button>
    </form>

    <div class="meta-row"><span>가입일</span><span id="created"></span></div>
    <div class="meta-row"><span>사용자 ID</span><span id="uid" style="font-family:monospace;font-size:12px"></span></div>
    <div class="meta-row"><span>로그인 방식</span><span id="provider"></span></div>

    <div class="row-actions">
      <button class="btn-block btn-ghost" id="signout">로그아웃</button>
      <a class="btn-block" id="admin-link" href="admin.html" style="display:none;text-align:center;text-decoration:none">관리자 페이지</a>
    </div>
  </div>
</main>

<script type="module">
  import { supabase, requireAuth, getProfile, signOut, renderNavAuth, escapeHtml } from "./app.js";

  renderNavAuth();

  const user = await requireAuth();
  if (user) init(user);

  async function init(user) {
    const profile = (await getProfile(user.id)) || {};
    const ok = document.getElementById("ok");
    const err = document.getElementById("err");

    const name = profile.full_name || user.user_metadata?.full_name || "";
    document.getElementById("who").textContent = name || user.email;
    document.getElementById("mail").textContent = user.email;
    document.getElementById("name").value = name;
    document.getElementById("uid").textContent = user.id;
    document.getElementById("created").textContent = new Date(
      profile.created_at || user.created_at
    ).toLocaleDateString("ko-KR");
    document.getElementById("provider").textContent =
      user.app_metadata?.provider || "email";

    const avatar = document.getElementById("avatar");
    const avatarUrl = profile.avatar_url || user.user_metadata?.avatar_url;
    if (avatarUrl) {
      avatar.outerHTML = `<img class="avatar" src="${escapeHtml(avatarUrl)}" alt="" />`;
    } else {
      avatar.textContent = (name || user.email).charAt(0).toUpperCase();
    }

    const badge = document.getElementById("role-badge");
    if (profile.role === "admin") {
      badge.textContent = "ADMIN";
      badge.classList.add("admin");
      document.getElementById("admin-link").style.display = "block";
    }

    document.getElementById("card").style.visibility = "visible";

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      ok.classList.remove("show");
      err.classList.remove("show");
      const btn = document.getElementById("save");
      btn.disabled = true;
      btn.textContent = "저장 중…";
      const { error } = await supabase
        .from("profiles")
        .update({ full_name: document.getElementById("name").value.trim() })
        .eq("id", user.id);
      btn.disabled = false;
      btn.textContent = "저장";
      if (error) {
        err.textContent = "저장 실패: " + error.message;
        err.classList.add("show");
      } else {
        ok.textContent = "저장되었습니다.";
        ok.classList.add("show");
        renderNavAuth();
      }
    });

    document.getElementById("signout").addEventListener("click", signOut);
  }
</script>
</body>
</html>
